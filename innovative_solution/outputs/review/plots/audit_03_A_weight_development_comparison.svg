  <g id="text_29">
   <text style="font-size: 16px; font-family: 'Microsoft YaHei'; text-anchor: middle" x="371.264063" y="19.99" transform="rotate(-0 371.264063 19.99)">已公开 A 样本权重的开发回测比较</text>
  </g>
  <g id="text_30">
   <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #283541" x="40.064063" y="322.5024" transform="rotate(-0 40.064063 322.5024)">权重 2 相对权重 1 的 MSE 仅低 0.223%；MAE 则以权重 1 更低。</text>
  </g>
  <g id="text_31">
   <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66727d" x="40.064063" y="346.2912" transform="rotate(-0 40.064063 346.2912)">三种策略使用相同 200 条开发验证记录（分折 50 / 50 / 100），按样本数合并计算。</text>
  </g>
  <g id="text_32">
   <text style="font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #66727d" x="40.064063" y="365.6448" transform="rotate(-0 40.064063 365.6448)">这些分数同时用于候选选择；行序分块重采样未显示权重 2 的稳定优势，不作显著性或 B 榜成绩声明。</text>
